<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body style="background-color: #744100; display: flex; flex-direction: row;align-content: space-between; align-items: center;">
    <div id="mapData" style="display: none;">%MAP%</div>
    <div id="enemiesData" style="display: none;">%ENEMIES%</div>
    <div id="charcterData" style="display: none;">%CHARACTER%</div>
    <div id="map" style="width: 70%; display: flex; align-items: center; justify-content: center;"></div>
    <!-- fight not yet aviable -->
    <div style="display: flex; flex-direction: column; align-items: space-around; justify-content: center; width: 30%; background-color: crimson;">
        <div id="fight" style="background-color: rgb(41, 66, 66); display: flex; flex-direction:row; align-content:space-between; width: 100%;">
            <div id="displayEnemy" style="visibility: hidden; margin:5% ;width: 50%;">
                <h2 id="enemyName"></h2>
                HP: <p id="enemyHealth" style="color: red;"></p><br>
                AP: <p id="enemyAttack" style="color: orange;"></p><br>
            </div>
            <div id="diplayCharacter" style="margin: 5%;width: 50%;">
                <h2 id="characterName"></h2>
                HP: <p id="characterHealth" style="color: red;"></p><br>
                AP: <p id="characterAttack" style="color: orange;"></p><br>
                Helmet: <p id="characterHelmet" style="color: rgb(107, 91, 47);"></p>
                Armor: <p id="characterArmor" style="color: rgb(107, 91, 47);"></p>
                Weapon: <p id="characterWeapon" style="color: rgb(118, 161, 172);"></p>
                <button id="attack">Attack Enemy</button>
                <button id="push">pushEnemy</button>
            </div>
        </div>
        <div id="finished" style="visibility: hidden; background-color: rgb(0, 97, 65);width: 20">
            <h1>You reached the Goal</h1>
            <form action="nextMap">
                <input type="text" name="currentMapId" id="currentMapId" style="display: none;">
                <input type="text" name="currentCharacterId" id="currentCharacterId" style="display: none;">
                <input type="submit" value="play next Map">
            </form>
            <a href="%LOGIN%"><button>mack to benu</button></a>
        </div>
    </div>
    <script src="../../functions/game/mainGame.js"></script>
</body>
</html>
